<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha-derecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f78b4"/>
    </marker>
    <marker id="flecha-izquierda" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#41ab5d"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="410" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Arquitectura de una aplicación Shiny</text>

  <!-- ===== Cliente / Interfaz de usuario ===== -->
  <rect x="30" y="70" width="300" height="290" rx="14" fill="#eaf3fb" stroke="#1f78b4" stroke-width="2.5"/>
  <text x="180" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f78b4">Cliente</text>
  <text x="180" y="122" text-anchor="middle" font-size="14" fill="#1f78b4">Interfaz de usuario (navegador)</text>

  <!-- Controles de entrada -->
  <rect x="55" y="145" width="250" height="90" rx="10" fill="#ffffff" stroke="#1f78b4" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Controles de entrada</text>
  <text x="180" y="187" text-anchor="middle" font-size="12" fill="#555">(input widgets)</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="#555">listas, deslizadores,</text>
  <text x="180" y="226" text-anchor="middle" font-size="12" fill="#555">casillas de verificación</text>

  <!-- Controles de salida -->
  <rect x="55" y="250" width="250" height="90" rx="10" fill="#ffffff" stroke="#41ab5d" stroke-width="1.5"/>
  <text x="180" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Controles de salida</text>
  <text x="180" y="292" text-anchor="middle" font-size="12" fill="#555">(output widgets)</text>
  <text x="180" y="315" text-anchor="middle" font-size="12" fill="#555">mapas, gráficos,</text>
  <text x="180" y="331" text-anchor="middle" font-size="12" fill="#555">tablas</text>

  <!-- ===== Servidor ===== -->
  <rect x="490" y="70" width="300" height="290" rx="14" fill="#eafaf0" stroke="#41ab5d" stroke-width="2.5"/>
  <text x="640" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e8b57">Servidor</text>
  <text x="640" y="122" text-anchor="middle" font-size="14" fill="#2e8b57">Proceso de R en ejecución</text>

  <!-- Funciones reactivas -->
  <rect x="515" y="160" width="250" height="160" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="640" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Funciones reactivas</text>
  <text x="640" y="215" text-anchor="middle" font-size="12" fill="#555">Reciben las entradas,</text>
  <text x="640" y="232" text-anchor="middle" font-size="12" fill="#555">procesan los datos y</text>
  <text x="640" y="249" text-anchor="middle" font-size="12" fill="#555">generan las salidas con</text>
  <text x="640" y="275" text-anchor="middle" font-size="12" font-family="monospace" fill="#1f78b4">reactive()</text>
  <text x="640" y="296" text-anchor="middle" font-size="12" font-family="monospace" fill="#41ab5d">render*()</text>

  <!-- ===== Flechas de comunicación ===== -->
  <!-- input: cliente -> servidor -->
  <line x1="330" y1="190" x2="490" y2="190" stroke="#1f78b4" stroke-width="3" marker-end="url(#flecha-derecha)"/>
  <text x="410" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f78b4">input</text>
  <text x="410" y="208" text-anchor="middle" font-size="11" fill="#1f78b4">valores de entrada</text>

  <!-- output: servidor -> cliente -->
  <line x1="490" y1="285" x2="330" y2="285" stroke="#41ab5d" stroke-width="3" marker-end="url(#flecha-izquierda)"/>
  <text x="410" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e8b57">output</text>
  <text x="410" y="303" text-anchor="middle" font-size="11" fill="#2e8b57">resultados</text>

  <!-- Pie -->
  <text x="410" y="395" text-anchor="middle" font-size="12" fill="#777">La persona usuaria cambia un control y las salidas se recalculan automáticamente.</text>
</svg>
